<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="แอป JavaScript: เกมไพ่ แบล็คแจ็ค (Blackjack)">
    <title>My Portfolio | Blackjack</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="blackjack-page">
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">My<span>Space</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cv.html">Profile</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="password.html">Password Gen</a></li>
                <li><a href="blackjack.html" class="active" aria-current="page">Blackjack</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container app-layout">
        <section class="game-area card">
            <h1 class="text-center highlight">Blackjack 21 🃏</h1>
            
            <div class="game-table">
                <div class="hand-section" id="dealer-hand-section">
                    <h3>Dealer's Hand: <span id="dealer-score" class="score">?</span></h3>
                    <div class="cards-display" id="dealer-cards">
                        <div class="card-placeholder">Waiting...</div>
                    </div>
                </div>

                <div class="hand-section" id="player-hand-section">
                    <h3>Your Hand: <span id="player-score" class="score">0</span></h3>
                    <div class="cards-display" id="player-cards">
                        <div class="card-placeholder">Press 'New Game'</div>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <button type="button" id="new-game-btn" class="btn btn-primary">New Game</button>
                
                <div id="js-action-controls" style="display: none;">
                    <button type="button" id="hit-btn" class="btn btn-outline">Hit (ขอไพ่)</button>
                    <button type="button" id="stand-btn" class="btn btn-outline">Stand (พอ)</button>
                </div>
            </div>

            <div id="game-message" class="game-message text-center"></div>

            <noscript>
                <div class="alert alert-danger" style="margin-top: 1rem;">
                    <strong>คำเตือน:</strong> เกมนี้ต้องการ JavaScript ในการเล่น กรุณาเปิดใช้งาน
                </div>
            </noscript>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 กันตพัฒน์ ตั้งกิตติธารา. สร้างด้วย HTML, CSS และ Vanilla JS.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
