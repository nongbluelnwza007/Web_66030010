<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="แอปพลิเคชันสุ่มรหัสผ่านที่ปลอดภัย เขียนด้วย JavaScript">
    <title>My Portfolio | JS App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">My<span>Space</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cv.html">Profile</a></li>
                <li><a href="app.html" class="active" aria-current="page">JS App</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container app-layout">
        <section class="app-card">
            <h1 class="text-center">Secure Password Generator</h1>
            <p class="text-center">เครื่องมือสุ่มรหัสผ่านเพื่อความปลอดภัยทางไซเบอร์</p>
            
            <form id="generator-form" action="#" method="GET">
                <div class="form-group flex-group">
                    <label for="length">ความยาวรหัสผ่าน (8-32):</label>
                    <input type="number" id="length" name="length" min="8" max="32" value="16" required>
                </div>
                
                <div class="result-box">
                    <input type="text" id="result" name="generated-password" readonly placeholder="รหัสผ่านจะแสดงที่นี่..." aria-label="Generated Password">
                </div>

                <noscript>
                    <div class="noscript-warning">
                        <strong>คำเตือน:</strong> เบราว์เซอร์ของคุณปิดการทำงานของ JavaScript อยู่ เครื่องมือสุ่มรหัสผ่านฝั่งไคลเอนต์จะไม่ทำงาน กรุณาเปิด JavaScript เพื่อใช้งาน
                    </div>
                    <button type="submit" class="btn btn-primary" disabled>สุ่มรหัสผ่าน (ต้องการ JS)</button>
                </noscript>
                
                <div id="js-controls" style="display: none;">
                    <button type="button" id="generate-btn" class="btn btn-primary w-100">สร้างรหัสผ่านใหม่ 🔄</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 กันตพัฒน์ ตั้งกิตติธารา. สร้างด้วย HTML, CSS และ Vanilla JS.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
